name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:web
      - run: pnpm check:evals
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build:web
      - run: pnpm test
      - run: pnpm test:evals
